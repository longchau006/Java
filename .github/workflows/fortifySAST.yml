name: Fortify SSC Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  fortify:
    runs-on: self-hosted

    # Thêm khối permissions này:
    permissions:
      contents: read
      security-events: write   # Để đẩy file SARIF lên tab Security của GitHub
      checks: write            # Để tạo Check Run hiển thị kết quả kiểm tra
      pull-requests: write     # (Tùy chọn) Để comment kết quả vào PR

    steps:
      - name: Add Git Bash to PATH
        shell: powershell
        run: |
          $gitBin = "C:\Program Files\Git\bin"
          $gitUsrBin = "C:\Program Files\Git\usr\bin"
          
          # Đẩy cả 2 thư mục vào GITHUB_PATH để composite action nhận diện được bash
          if (Test-Path $gitBin) { $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          if (Test-Path $gitUsrBin) { $gitUsrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Check out source code
        uses: actions/checkout@v4

      # Thay đổi build tool phù hợp nếu dự án cần (ví dụ Java/Maven, .NET, Node.js...)
      # - name: Set up JDK
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: 'temurin'
      #     java-version: '17'

      # Bước 1: Setup môi trường công cụ Fortify (fcli, scancentral...)
      - name: Setup Fortify Tools
        uses: fortify/github-action@v3
        env:
          SSC_URL: ${{ secrets.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_SAST_TOKEN }}
          SSC_APPVERSION: ${{ secrets.SSC_APPVERSION }}
          SSC_APPLICATION: ${{ secrets.SSC_APP }}
          SC_CLIENT_VERSION: "26.2.0"

      # Bước 2: Chạy lệnh quét ScanCentral
      - name: Run Fortify Scan
        shell: powershell
        run: |
          scancentral -url "$env:SSC_URL" start -uptoken "$env:SSC_TOKEN" -application "$env:SSC_APPLICATION" -version "$env:SSC_APPVERSION"
        env:
          SSC_URL: ${{ secrets.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_SAST_TOKEN }}
          SSC_APPVERSION: ${{ secrets.SSC_APPVERSION }}
          SSC_APPLICATION: ${{ secrets.SSC_APP }}
